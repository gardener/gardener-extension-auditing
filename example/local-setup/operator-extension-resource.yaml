apiVersion: operator.gardener.cloud/v1alpha1
kind: Extension
metadata:
  name: extension-auditing
  annotations:
    security.gardener.cloud/pod-security-enforce: baseline
spec:
  resources:
  - clusterCompatibility:
    - garden
    - shoot
    kind: Extension
    type: auditing
    workerlessSupported: true
    lifecycle:
      reconcile: BeforeKubeAPIServer
      delete: AfterKubeAPIServer
      migrate: AfterKubeAPIServer
  deployment:
    extension:
      helm:
        ociRepository:
          ref: local-skaffold/gardener-extension-auditing/charts/extension
          caBundleSecretRef:
            name: gardener-local-registry-ca
    admission:
      runtimeCluster:
        helm:
          ociRepository:
            ref: local-skaffold/gardener-extension-auditing-admission/charts/runtime
            caBundleSecretRef:
              name: gardener-local-registry-ca
      virtualCluster:
        helm:
          ociRepository:
            ref: local-skaffold/gardener-extension-auditing-admission/charts/application
            caBundleSecretRef:
              name: gardener-local-registry-ca
